[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmoe"
version = "0.1.0"
description = "Agent-conditioned expert working-set tracing and evaluation for MoE serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
datasets = ["pyarrow>=14"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tokenmoe*", "dataset_adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
