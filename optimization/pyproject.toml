[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmoe-opt"
version = "0.1.0"
description = "Causal expert demand analysis and bounded residency experiments"
requires-python = ">=3.10"
dependencies = ["tokenmoe-collect>=0.1.0", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
tokenmoe-opt = "tokenmoe_opt.cli:main"

[tool.setuptools.packages.find]
include = ["tokenmoe_opt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
