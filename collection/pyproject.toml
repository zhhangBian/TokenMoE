[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmoe-collect"
version = "0.1.0"
description = "Agent and engine traces for TokenMoE"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "numpy>=1.24", "pyarrow>=14", "tokenizers>=0.20", "psutil>=5.9", "nvidia-ml-py>=12", "pyyaml>=6"]

[project.optional-dependencies]
harness = ["mini-swe-agent==2.4.6"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
tokenmoe-collect = "tokenmoe_collect.cli:main"

[tool.setuptools.packages.find]
include = ["tokenmoe_collect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
